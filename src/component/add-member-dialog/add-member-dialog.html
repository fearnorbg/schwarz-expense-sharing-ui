<h2 mat-dialog-title>Add member</h2>
<form (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [formControl]="name" autocomplete="name" [readonly]="saving()" />
      @if (name.invalid && name.touched) {
        <mat-error>Member name is required.</mat-error>
      }
    </mat-form-field>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close [disabled]="saving()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="name.invalid || saving()">
      {{ saving() ? 'Adding...' : 'Add member' }}
    </button>
  </mat-dialog-actions>
</form>
