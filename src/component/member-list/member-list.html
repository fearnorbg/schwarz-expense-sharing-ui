<div class="members-table-container">
  <table mat-table [dataSource]="sortedMembers() ?? []" aria-label="Members">
    <ng-container matColumnDef="toolbar">
      <th mat-header-cell *matHeaderCellDef [attr.colspan]="displayedColumns.length">
        <div class="list-header">
          <h2>Members</h2>
          <button
            mat-flat-button
            type="button"
            aria-label="Add member"
            (click)="addMember.emit()"
            [disabled]="!sortedMembers()"
          >
            +
          </button>
        </div>
      </th>
    </ng-container>

    <ng-container matColumnDef="name">
      <td mat-cell *matCellDef="let member">{{ member.name }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['toolbar']"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr *matNoDataRow>
      <td class="table-status" [attr.colspan]="displayedColumns.length">
        @if (sortedMembers()) {
          No members added yet.
        } @else {
          <span role="status">Loading members...</span>
        }
      </td>
    </tr>
  </table>
</div>
